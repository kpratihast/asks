  - id: q18
    category: alias
    question: "Which course have Sathish Vadhiyar and Yogesh Simmhan taught together?"
    # Schedule rows spell them "S.Vadhiyar & Y. Simmhan", "S. Vadhiyar, Y. Simmhan" ... (alias resolution)
    # Tightened 2026-10-06: the row must list Simmhan. DS 221's 2025/2026 rows are Vadhiyar + C. Jain and
    # do NOT answer the question; the earlier spec (any DS 221 row) wrongly counted them as hits.
    gold: [{url: "https://cds.iisc.ac.in/courses/schedule/", heading_contains: "DS 221", text_contains: "Simmhan"}]
    verified: true

  - id: q19
    category: multihop
    question: "Which course did the DS 252 instructor teach in the Jan-Apr 2026 term?"
    # Cross-term hop: DS 252 -> instructor (current term) -> course in 2026-JAN (DS 256).
    # KNOWN LIMITATION: graph expansion applies the asked term (2026-JAN) to every hop, so the first hop
    # (DS 252 is not taught in 2026-JAN) finds nothing. See README "Open items".
    gold: [{url: "https://cds.iisc.ac.in/courses/schedule/", heading_contains: "DS 256", term: "2026-JAN"}]
    verified: true

  # ---- people / lab questions (added 2026-10-08, BEFORE building the people pass and the research-area
