# Retrieval dev set (NOT the held-out evaluation set; keep those separate and unseen).
#
# Gold is labelled at (url, section) level, not chunk_id, so it survives re-chunking.
# A gold spec matches a passage when ALL of its given fields match:
#   url, heading_contains, text_contains, term (academic_term), exclude_heading
# A question is a hit@k if ANY gold spec matches a top-k passage
# (multihop questions use need_all: true -> every gold spec must be matched).
#
# verified: false  -> drafted from what was visible remotely; check against your fetched pages with
#                     `python -m askiisc_retrieval.cli show-chunks --grep "DS 252"` and fix before trusting numbers.
# Current term when drafted: 2026-AUG.

questions:
  - id: q01
    category: answerable
    question: "Who teaches DS 252 this semester?"
    gold: [{url: "https://cds.iisc.ac.in/courses/schedule/", heading_contains: "DS 252", term: "2026-AUG"}]
    verified: true  # checked 2026-10-06

  - id: q02
