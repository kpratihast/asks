# Stale-version questions (PRD.md:258 asks for 10% of the evaluation set; #44).
# Kept separate from the held-out test_cds120.yaml, which is not edited or tuned on.
#
# Each question is asked against a private index (tools/eval_stale.py) that holds the current pages from
# tests/pages/ AND an older, superseded version of the same URL (fixtures/superseded_*.html) that gives a
# conflicting answer. The superseded version is embedded but not in the active snapshot (FR-9), so:
#   - no returned passage may come from it (superseded passages = 0), and
#   - the current answer should be found (`current` matches a passage from `url`).
# `superseded` matches the conflicting text, so the control search (no version filter) can show that the
# old answer really is in the index and would be found without the filter.
questions:
  - id: ST01
    question: What is the minimum number of credits an M.Tech (CDS) student must earn?
    url: https://cds.iisc.ac.in/courses/m-tech-course-requirements/
    current: 'minimum of 64 credits'
    superseded: 'minimum of 52 credits'
  - id: ST02
    question: What minimum CGPA is required to continue in the M.Tech programme after the first year?
    url: https://cds.iisc.ac.in/courses/m-tech-course-requirements/
    current: 'CGPA required\s+to continue in the M\.Tech\. programme is 5\.0'
    superseded: 'programme is 4\.5'
  - id: ST03
