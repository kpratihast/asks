# HELD-OUT TEST SET (from Aditya, received 2026-10-07). Converted to the dev_questions.yaml format.
#
# RULES: do not tune retrieval on these questions. Run once on a fixed configuration and report the
# result. If something is changed after seeing a test question fail, that question becomes dev data.
#
# Gold = the pages Aditya cited (any one matching page counts as a hit). For questions with several
# sources, eval also reports how many of them were found (gold_found).
# Expected answers are kept as `expected` for the generation/citation evaluation later.
#
# Gold labels and expected answers are EXACTLY as Aditya wrote them. "suggestion:" notes are proposals
# from the retrieval side; only Aditya (the evaluator) changes labels.

questions:
  - id: t01
    category: answerable
    question: "How do I contact the CDS Department?"
    expected: "Phone +91-80-2293 2789; Fax +91-80-2360 6332; E-mail office.cds@iisc.ac.in; Web cds.iisc.ac.in"
    gold: [{url: "https://cds.iisc.ac.in/contact-us/"}]

  - id: t02
    category: needs_decision
    question: "From where can I reserve the CDS room?"
    expected: "Link to the Outlook room calendar (IISc login)"
    gold: []
    # suggestion: the only source is a link in the site's "Shortcuts" sidebar. Sidebars are stripped as
    # boilerplate, so this cannot be retrieved as-is. Decide: (a) treat as unanswerable (abstain), or
    # (b) ingestion keeps the Shortcuts block as its own document. Not scored until decided.

  - id: t03
    category: answerable
    question: "What are the recent awards won by the CDS Faculty?"
    expected: "Phani Motamarri: Prof. Priti Shankar Award for Teaching Excellence 2026; Sravanti Addepalli: Sir Vithal N. Chandavarkar Memorial Medal"
