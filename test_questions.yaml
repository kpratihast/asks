      - {url: "https://cds.iisc.ac.in/people/vaanathi-sundaresan/"}
      - {url: "https://cds.iisc.ac.in/people/phaneendra-kumar-yalavarthy/"}
    # suggestion: the expected answer names Anirban Chakraborty, but his profile is not cited; and the
    # Bioinformatics research page is a natural source. Add them as gold? (Aditya to decide.)

  - id: t06
