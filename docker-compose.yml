# Local services for retrieval development.
#   docker compose up -d qdrant                 # now
#   docker compose --profile graph up -d neo4j  # phase 2 (graph store)
# Ports bind to 127.0.0.1 only: nothing is reachable from outside your laptop.
# Named volumes (not folders) because Windows folder mounts are slow and unreliable for databases.
name: askiisc-dev

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2          # matches qdrant-client 1.19.x
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
    mem_limit: 1g
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    profiles: [graph]
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/askiisc-dev
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes: [neo4j_data:/data]
    mem_limit: 1g
    restart: unless-stopped

volumes:
  qdrant_data: {}
  neo4j_data: {}
