# Pages for the retrieval dev corpus. Fetched ONCE by `python -m askiisc_retrieval.cli fetch`
# and saved under data/raw/, so every later run works offline on the same snapshot.
# Add reviewed pages with an explicit department code from config/departments.yaml.
# Default scope is CDS. Enable others with ASKIISC_SOURCE_DEPARTMENTS=CDS,CSA,ECE.
department: CDS
pages:
  - {url: "https://www.iisc.ac.in/admissions/research-programmes/", department: IISc, doc_type: admissions, scope: public, normalize: programmes}
  - {url: "https://www.iisc.ac.in/admissions/m-tech-m-des/",         department: IISc, doc_type: admissions, scope: public, normalize: programmes}
  - {url: "https://www.iisc.ac.in/admissions/m-tech-through-cfti-mode-2/", department: IISc, doc_type: admissions, scope: public, normalize: cfti}
  - {url: "https://www.iisc.ac.in/admissions/faq/",                 department: IISc, doc_type: admissions, scope: public, normalize: faq}
  - {url: "https://www.iisc.ac.in/admissions/fees-and-scholarships/", department: IISc, doc_type: admissions, scope: public, normalize: fees}
  - url: "https://www.iisc.ac.in/wp-content/uploads/2026/08/SoI-Aug-Dec-2026-Term.pdf"
    department: IISc
    doc_type: catalogue
    scope: public
    pdf:
      title: "Scheme of Instruction (August 2026 edition)"
      # Physical PDF pages, inclusive. Recheck chapter boundaries for a new edition.
      page_ranges:
        IISc: [2, 3]
        CSA: [35, 42]
        ECE: [43, 50]
        CDS: [74, 77]
  - {url: "https://cds.iisc.ac.in/courses/descriptions/",               doc_type: catalogue,  scope: public}
  - {url: "https://cds.iisc.ac.in/courses/schedule/",                   doc_type: schedule,   scope: public}
  - {url: "https://cds.iisc.ac.in/courses/m-tech-course-requirements/", doc_type: policy,     scope: public}
  - {url: "https://cds.iisc.ac.in/academics/degree-programs/",          doc_type: policy,     scope: public}
  - {url: "https://cds.iisc.ac.in/admissions/research-degrees/",        doc_type: admissions, scope: public}
  - {url: "https://cds.iisc.ac.in/admissions/course-degrees/",          doc_type: admissions, scope: public}
  - {url: "https://cds.iisc.ac.in/people-all/faculty/",                 doc_type: people,     scope: public}
  - {url: "https://cds.iisc.ac.in/research-new/data-management-computing-and-analytics/", doc_type: research, scope: public}
  - {url: "https://cds.iisc.ac.in/research-new/software-and-runtime-systems/",            doc_type: research, scope: public}
  # Public pilot sources. Keep current-cycle notices separate from standing programme pages.
  - {url: "https://www.csa.iisc.ac.in/academics-all/prospective-students-resources/", department: CSA, doc_type: admissions, scope: public}
  - {url: "https://www.csa.iisc.ac.in/group/faculty/",                  department: CSA, doc_type: people,     scope: public}
  - {url: "https://www.csa.iisc.ac.in/research-all/research-labs/",     department: CSA, doc_type: research,   scope: public}
  - {url: "https://ece.iisc.ac.in/general-info-mtech-ece/", department: ECE, doc_type: admissions, scope: public}
  - {url: "https://ece.iisc.ac.in/faculty/",                department: ECE, doc_type: people,     scope: public}
  - {url: "https://ece.iisc.ac.in/research/",               department: ECE, doc_type: research,   scope: public}

# Bounded crawl of the CDS site (added 2026-10-08). The corpus is defined by the site's own links, not by
# any question set. Pages listed above keep their doc_type and are never re-downloaded. Pages the crawl
# finds are added with a doc_type inferred from their URL. See askiisc_retrieval/crawl.py for the rules.
crawl:
  seeds: ["https://cds.iisc.ac.in/"]
  max_depth: 2        # clicks from the homepage
  max_pages: 200      # hard cap (CPU embedding time grows with this)
  delay_s: 0.5        # politeness delay between downloads

# Follow links from public source pages during ingestion. Each host must be approved.
linked_pages:
  CDS:
    hosts: [cds.iisc.ac.in]
    from_types: [schedule, catalogue]
    doc_type: page
    max_pages: 12

# Synthetic test documents (fixtures/). These exist only to test filters; see fixtures/README.md.
fixtures: fixtures/fixtures.yaml
