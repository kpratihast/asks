name: Test and deploy AskIISc
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: deploy/aws/ci-requirements.lock
      - name: Install hash-locked offline test dependencies
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r deploy/aws/ci-requirements.lock
      - name: Test application, ACLs and deployment safety
        run: python -m pytest -q
      - name: Check bootstrap shell and Python syntax
        run: |
          bash -n deploy/aws/bootstrap.sh run-local.sh model.sh deploy-aws.sh model-aws.sh
          python -m compileall -q askiisc_retrieval askiisc_serving deploy/aws
  deploy:
    needs: validate
    if: >-
      github.event_name != 'pull_request' &&
      startsWith(github.ref, 'refs/heads/') &&
      vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: askiisc-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: askiisc-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Deploy code using the existing AWS corpus and model configuration
        env:
          DEPLOY_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          DEPLOY_REGION: ${{ vars.AWS_REGION }}
          DEPLOY_STACK: ${{ vars.AWS_STACK_NAME }}
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python deploy/aws/ci.py --account "$DEPLOY_ACCOUNT" --region "$DEPLOY_REGION"
          --stack "$DEPLOY_STACK" --commit "$DEPLOY_COMMIT"
          --run-id "$DEPLOY_RUN_ID" --attempt "$DEPLOY_ATTEMPT"
